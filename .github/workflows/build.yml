name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bundle the PDF reader so the app works offline.
      - name: Fetch pdf.js
        run: |
          mkdir -p /tmp/pdfjs && cd /tmp/pdfjs
          npm pack pdfjs-dist@3.11.174
          tar xzf pdfjs-dist-3.11.174.tgz package/build/pdf.min.js package/build/pdf.worker.min.js
          cp package/build/pdf.min.js package/build/pdf.worker.min.js "$GITHUB_WORKSPACE/app/src/main/assets/www/"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceForecast-apk
          path: app/build/outputs/apk/debug/app-debug.apk
